<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 가계부</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF2EC; --surface:#FFFFFF; --band:#DDE9E0; --ink:#1C2934; --muted:#5C6C76;
  --line:#C6D5CB; --line-soft:#E3EBE5; --stamp:#C0392B; --save:#2C7450; --warn:#B0501C;
  --h:#3B60A3; --w:#A04B70; --j:#58766A; --focus:#2F6FD6; --field:#F7FAF7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --print:"Nanum Gothic Coding","D2Coding","Apple SD Gothic Neo","Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111714; --surface:#19211D; --band:#1F2E27; --ink:#E3EBE5; --muted:#95A49C;
    --line:#33433A; --line-soft:#253129; --stamp:#E2604E; --save:#62BE8E; --warn:#E59C60;
    --h:#8AA9E2; --w:#DF91B3; --j:#93B6A3; --focus:#79A6F2; --field:#141B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#19211D; --band:#1F2E27; --ink:#E3EBE5; --muted:#95A49C;
  --line:#33433A; --line-soft:#253129; --stamp:#E2604E; --save:#62BE8E; --warn:#E59C60;
  --h:#8AA9E2; --w:#DF91B3; --j:#93B6A3; --focus:#79A6F2; --field:#141B18;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
@media (max-width:640px){header.top{position:static}}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0 10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:8px}
.tab{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .cur{font-weight:600;font-size:16px;min-width:8.5em;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.ghost:hover,.icon-btn:hover{border-color:var(--muted)}
.primary{border:0;background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.primary:disabled{opacity:.4;cursor:default}
.danger{color:var(--stamp)}
.note{font-size:13px;color:var(--muted)}
.hints{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}
.hint{font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--band);color:var(--ink)}
.hint.alert{background:transparent;border:1px solid var(--stamp);color:var(--stamp)}

main{padding:22px 0 60px}

/* month layout */
.month{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.month{grid-template-columns:1fr}}
.left{position:sticky;top:var(--hdr,150px)}
@media (max-width:900px){.left{position:static}}

/* passbook */
.passbook{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.pb-scroll{border-radius:0 0 4px 4px}
.pb-head{position:relative;display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 10px;border-bottom:2px solid var(--ink)}
.pb-head h2{margin:0;font-size:16px;font-weight:700}
.pb-head span{font-size:12.5px;color:var(--muted)}
.passbook.closed .pb-head span{visibility:hidden}
.pb-scroll{overflow-x:auto}
table.pb{width:100%;border-collapse:collapse;font-family:var(--print);font-size:13.5px;min-width:520px}
table.pb th{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:7px 10px;background:var(--band);border-bottom:1px solid var(--line)}
table.pb th:nth-child(1),table.pb th:nth-child(2){text-align:left}
table.pb td{padding:6px 10px;border-bottom:1px dashed var(--line-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.pb td.d{text-align:left;color:var(--muted);width:3.6em}
table.pb td.l{text-align:left;white-space:normal;min-width:10em}
table.pb td.o{color:var(--ink)}
table.pb td.i{color:var(--save)}
table.pb td.b{color:var(--muted)}
table.pb tr.sub td{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);font-weight:700;background:var(--field)}
table.pb tr.end td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;font-size:15px;padding:11px 10px}
table.pb tr.end td.b{color:var(--ink)}
table.pb tr.end.neg td.b{color:var(--stamp)}
.pb-empty{padding:30px 18px;color:var(--muted);font-size:14px}
.who{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.who.h{background:var(--h)}.who.w{background:var(--w)}.who.j{background:var(--j)}

.stamp{position:absolute;right:16px;top:-18px;width:64px;height:64px;z-index:1;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;transform:rotate(-14deg);pointer-events:none;font-family:var(--sans);line-height:1.15;opacity:.88;mix-blend-mode:multiply}
:root[data-theme="dark"] .stamp{mix-blend-mode:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}
.stamp b{display:block;font-size:15px;letter-spacing:.1em}
.stamp i{font-style:normal;font-size:9.5px}
.stamp::before{content:"";position:absolute;inset:3px;border:1px solid var(--stamp);border-radius:50%}
.stamp.fresh{animation:press .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes press{0%{transform:rotate(-14deg) scale(1.8);opacity:0}60%{opacity:.95}100%{transform:rotate(-14deg) scale(1);opacity:.88}}
@media (prefers-reduced-motion:reduce){.stamp.fresh{animation:none}}

/* pots */
.pots{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 18px}
.pots h3{margin:0 0 10px;font-size:14px}
.pot{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line-soft)}
.pot:first-of-type{border-top:0}
.pot .n{font-size:13.5px}
.pot .v{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.pot .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.pot .bar i{display:block;height:100%;background:var(--j)}
.pot.over .bar i{background:var(--stamp)}
.pot.over .v{color:var(--stamp)}
.pot .s{grid-column:1/-1;font-size:12px;color:var(--muted)}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:13px 16px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary h3{margin:0;font-size:15px;font-weight:600}
.sec>summary .sum{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.sec>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-left:6px;position:relative;top:-3px}
.sec[open]>summary::after{transform:rotate(-135deg);top:2px}
.sec-body{padding:0 16px 14px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px;align-items:center}
.row.inc{grid-template-columns:3.6em 5.4em 7.4em minmax(6em,1fr) minmax(5em,1fr) 28px}
.row.fx{grid-template-columns:22px minmax(7em,1.4fr) 4em minmax(6em,1fr) 28px}
.row.ln{grid-template-columns:minmax(7em,1.3fr) minmax(5.5em,1fr) minmax(5.5em,1fr)}
.ln-item{padding:8px 0;border-top:1px solid var(--line-soft)}
.rows .head+.head+.ln-item{border-top:0}
.row.ln2{grid-template-columns:minmax(6em,1.1fr) minmax(9.5em,1.3fr) minmax(5.5em,1fr) minmax(5em,.9fr) 28px}
.row.ln3{grid-template-columns:5em 6.6em 4.4em minmax(6em,1fr) minmax(6em,1.3fr);margin-top:6px}
.row.ln3 .note{font-size:12.5px}
.row.sp{grid-template-columns:minmax(8em,1.3fr) 6.6em minmax(6em,1fr) minmax(5em,1fr) 28px}
.row.sv{grid-template-columns:minmax(8em,1.4fr) minmax(6em,1fr) 4.2em}
.row.head{font-size:11.5px;color:var(--muted);padding:0 2px}
@media (max-width:560px){
  .row.ln2{grid-template-columns:1fr 1fr 28px}.row.ln2>:nth-child(5){grid-column:3;grid-row:1}
  .row.ln3{grid-template-columns:1fr 1fr}.row.ln3 .note{grid-column:1/-1}
  .row.inc{grid-template-columns:3.4em 1fr 1fr 28px}
  .row.inc .amt{grid-column:1/3}.row.inc .memo{grid-column:3/4}
  .row.sp{grid-template-columns:1fr 1fr 28px}
  .row.sp .amt{grid-column:1/2}.row.sp .memo{grid-column:2/3}
  .row.head{display:none}
}
.f{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:6px 8px;font-size:14px}
.f:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.f.num{text-align:right;font-variant-numeric:tabular-nums}
.f.zero{color:var(--muted)}
.f:disabled{opacity:.7}
select.f{padding-right:4px}
.del{border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:16px}
.del:hover{color:var(--stamp);background:var(--line-soft)}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.tag.h{color:var(--h)}.tag.w{color:var(--w)}.tag.j{color:var(--j)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.grid2 label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.catlist{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.catlist b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.closebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
textarea.f{min-height:64px;resize:vertical}
.chk{width:18px;height:18px;accent-color:var(--save)}
.ro{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* empty */
.empty{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:36px 28px;max-width:560px}
.empty h2{margin:0 0 6px;font-size:19px}
.empty p{margin:0 0 18px;color:var(--muted)}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap}

/* tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.t th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line-soft);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--field)}
table.t tr.tot td{border-top:1.5px solid var(--ink);font-weight:700;border-bottom:0}
table.t td.neg{color:var(--stamp)}
table.t td.dim{color:var(--muted);text-align:left}
.mini-stamp{display:inline-block;border:1.5px solid var(--stamp);color:var(--stamp);border-radius:50%;width:22px;height:22px;line-height:19px;text-align:center;font-size:11px;font-weight:700;transform:rotate(-12deg)}
.ev{display:grid;grid-template-columns:7em 1fr auto;gap:4px 14px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:14px}
.ev:first-of-type{border-top:0}
.ev .when{color:var(--muted);font-size:13px}
.ev .st{font-variant-numeric:tabular-nums;text-align:right}
.ev .st.got{color:var(--save)}
.kpis{display:flex;flex-wrap:wrap;gap:10px 36px;margin-bottom:6px}
.kpi>span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* settings */
.set-row{display:grid;gap:6px;align-items:center;margin-bottom:6px}
.set-row.fx{grid-template-columns:minmax(8em,1.6fr) 5.4em minmax(6em,1fr) 28px}
.set-row.ln{grid-template-columns:minmax(7em,1.4fr) 5em minmax(5.5em,1fr) 6.6em 4.6em minmax(5.5em,1fr) 28px}
.set-row.ac{grid-template-columns:minmax(7em,1.4fr) 5.4em 5em minmax(6em,1fr) 28px}
.set-row.head{font-size:11.5px;color:var(--muted)}
@media (max-width:640px){
  .set-row.ln{grid-template-columns:1fr 1fr 28px}
  .set-row.ln .wide{grid-column:1/-1}
  .set-row.head{display:none}
}
.data-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.loading{padding:60px 0;color:var(--muted)}
.mode{font-size:12px;color:var(--muted);margin-top:28px}
</style>
</head>

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>(Math.round(Number(n)||0)).toLocaleString("ko-KR");
const man=n=>{n=Math.round(Number(n)||0);const a=Math.abs(n);if(a<10000)return won(n)+"원";const v=n/10000;return (Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10).toLocaleString("ko-KR")+"만";};
const parseAmt=s=>{const neg=/^\s*-/.test(String(s));const v=String(s).replace(/[^\d]/g,"");const n=v?parseInt(v,10):0;return neg?-n:n;};
const sum=(arr,f)=>(arr||[]).reduce((a,x)=>a+(Number(f?f(x):x.amount)||0),0);
const ymOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const ymParts=ym=>{const [y,m]=ym.split("-").map(Number);return {y,m};};
const addM=(ym,n)=>{const {y,m}=ymParts(ym);const d=new Date(y,m-1+n,1);return ymOf(d);};
const ymLabel=ym=>{const {y,m}=ymParts(ym);return y+"년 "+m+"월";};
const lastSunday=ym=>{const {y,m}=ymParts(ym);const d=new Date(y,m,0);d.setDate(d.getDate()-d.getDay());return d;};
const typeOf=id=>INCOME_TYPES.find(t=>t.id===id)||INCOME_TYPES[INCOME_TYPES.length-1];
const srcOf=id=>SOURCES.find(s=>s.id===id)||SOURCES[0];
const clone=o=>JSON.parse(JSON.stringify(o));
const nameOf=o=>o==="j"?"공동":(S.config.names[o]||(o==="h"?"남편":"아내"));
const srcLabel=s=>(s.owner==="j"?"공동 ":nameOf(s.owner)+" ")+s.label;
const ymCmp=(a,b)=>a<b?-1:a>b?1:0;
const monthDiff=(a,b)=>{const x=ymParts(a),y=ymParts(b);return (y.y-x.y)*12+(y.m-x.m);};
const payerLabel=id=>{const p=PAYERS.find(x=>x.id===id);if(!p||!p.id)return "";return nameOf(p.owner)+" "+p.label;};

/* ---------- state ---------- */
const S={config:null,months:{},ym:ymOf(new Date()),year:new Date().getFullYear(),tab:"month",mode:"loading",readOnly:false,stampFresh:null,confirm:null};

function normConfig(c){
  const d=DEFAULT_CONFIG();
  c=c&&typeof c==="object"?clone(c):{};
  c.names=Object.assign({},d.names,c.names||{});
  c.paydays=Object.assign({},d.paydays,c.paydays||{});
  c.defaults=Object.assign({},d.defaults,c.defaults||{});
  ["fixed","loans","accounts"].forEach(k=>{if(!Array.isArray(c[k]))c[k]=d[k];});
  c.v=1;return c;
}
function normMonth(m,ym){
  m=m&&typeof m==="object"?clone(m):{};
  m.ym=ym;
  ["incomes","fixed","loans","spends"].forEach(k=>{if(!Array.isArray(m[k]))m[k]=[];});
  m.transfers=Object.assign({hAllow:0,wAllow:0,hLiving:0,wLiving:0},m.transfers||{});
  if(!m.savings||typeof m.savings!=="object")m.savings={};
  if(typeof m.memo!=="string")m.memo="";
  m.closed=!!m.closed;
  return m;
}

/* ---------- loans ---------- */
function loanPaidUntil(loanId,ym){
  let t=0;
  for(const k in S.months){if(ymCmp(k,ym)<=0){const l=(S.months[k].loans||[]).find(x=>x.loanId===loanId);if(l)t+=(l.amount||0)+(l.lump||0);}}
  return t;
}
function loanBalance(loan,ym){return loan.principal?Math.max(0,loan.principal-loanPaidUntil(loan.id,ym)):null;}
function loanActive(loan,ym){
  if(loan.start&&ymCmp(ym,loan.start)<0)return false;
  if(loan.start&&loan.months>0&&ymCmp(ym,addM(loan.start,loan.months))>=0)return false;
  if(loan.principal&&loanBalance(loan,addM(ym,-1))<=0)return false;
  return true;
}

/* ---------- calc ---------- */
function walletUntil(ym){let b=0;for(const k in S.months){if(ymCmp(k,ym)<=0){const m=S.months[k];b+=sum(m.incomes.filter(i=>i.type==="cash"))-sum(m.spends.filter(x=>x.src==="cash"));}}return b;}
function calc(m){
  const cfg=S.config,r={};
  const inc=m.incomes;
  r.cashIncome=sum(inc.filter(i=>typeOf(i.type).cash));
  r.support=sum(inc.filter(i=>i.type==="support"));
  r.points=sum(inc.filter(i=>i.type==="points"));
  r.tripIn=sum(inc.filter(i=>i.type==="trip"));
  r.cashIn=sum(inc.filter(i=>i.type==="cash"));
  const t=m.transfers;
  r.transfers=(t.hAllow||0)+(t.wAllow||0)+(t.hLiving||0)+(t.wLiving||0);
  r.fixed=sum(m.fixed);
  r.loans=sum(m.loans,l=>(l.amount||0)+(l.lump||0));
  r.bySrc={};r.byCat={};
  m.spends.forEach(s=>{r.bySrc[s.src]=(r.bySrc[s.src]||0)+(s.amount||0);const c=s.cat||"기타";r.byCat[c]=(r.byCat[c]||0)+(s.amount||0);});
  r.card=sum(m.spends.filter(s=>srcOf(s.src).cash));
  r.saving=0;r.invest=0;
  for(const id in m.savings){const a=cfg.accounts.find(x=>x.id===id);const v=Number(m.savings[id])||0;if(a&&a.kind==="투자")r.invest+=v;else r.saving+=v;}
  r.canSave=r.cashIncome-r.transfers-r.fixed-r.loans-r.card;
  r.left=r.canSave-r.saving-r.invest;
  r.pots=[
    {id:"living",name:"공동 생활비통장",budget:(t.hLiving||0)+(t.wLiving||0),used:r.bySrc.joint||0,note:"월급날 각자 이체한 생활비"},
    {id:"support",name:"업무지원비",budget:r.support,used:r.bySrc.support||0,note:"식료품 구매만 가능"},
    {id:"trip",name:"출장",budget:r.tripIn,used:r.bySrc.h_corp||0,note:"받은 출장비 대비 임직원카드 사용",trip:true},
    {id:"hAllow",name:nameOf("h")+" 용돈",budget:t.hAllow||0,used:r.bySrc.h_check||0,note:"기록한 만큼만 표시",optional:true},
    {id:"wAllow",name:nameOf("w")+" 용돈",budget:t.wAllow||0,used:r.bySrc.w_check||0,note:"기록한 만큼만 표시",optional:true},
    {id:"points",name:"네이버포인트",budget:r.points,used:r.bySrc.points||0,note:"명절에 받은 포인트"},
    {id:"wallet",name:"현금",budget:r.cashIn,used:r.bySrc.cash||0,note:"현금으로 받고 쓴 돈",wallet:true,bal:walletUntil(m.ym)}
  ].filter(p=>p.optional?p.used>0:(p.budget>0||p.used>0));
  return r;
}

function passbookRows(m){
  const cfg=S.config,rows=[];let ord=0;
  m.incomes.filter(i=>typeOf(i.type).cash&&(i.amount||0)!==0).forEach(i=>{
    rows.push({day:Number(i.day)||31,ord:ord++,label:'<span class="who '+i.who+'"></span>'+esc(nameOf(i.who)+" "+typeOf(i.type).label)+(i.memo?' <span class="note">'+esc(i.memo)+'</span>':""),inn:i.amount});
  });
  const t=m.transfers,hd=cfg.paydays.h,wd=cfg.paydays.w;
  const tr=(day,who,label,amt)=>{if(amt)rows.push({day,ord:1000+ord++,label:'<span class="who '+who+'"></span>'+esc(label),out:amt});};
  tr(hd,"h",nameOf("h")+" 용돈 → 용돈통장",t.hAllow);
  tr(hd,"h",nameOf("h")+" 생활비 → 공동통장",t.hLiving);
  tr(wd,"w",nameOf("w")+" 용돈 → 용돈통장",t.wAllow);
  tr(wd,"w",nameOf("w")+" 생활비 → 공동통장",t.wLiving);
  rows.sort((a,b)=>a.day-b.day||a.ord-b.ord);
  rows.forEach(r=>r.d=r.day>=31?"–":String(r.day).padStart(2,"0"));
  const tail=[];
  const fx=sum(m.fixed);
  if(fx)tail.push({d:"월중",label:"고정비 "+m.fixed.filter(f=>f.amount).length+"건",out:fx});
  const lnBy={};
  m.loans.forEach(l=>{const L=S.config.loans.find(x=>x.id===l.loanId);const k=(L&&L.payer)||"";lnBy[k]=(lnBy[k]||0)+(l.amount||0)+(l.lump||0);});
  Object.keys(lnBy).forEach(k=>{if(lnBy[k])tail.push({d:"월중",label:"할부·대출 상환"+(k?' <span class="note">'+esc(payerLabel(k))+'</span>':""),out:lnBy[k]});});
  const r=calc(m);
  SOURCES.filter(s=>s.cash&&r.bySrc[s.id]).forEach(s=>tail.push({d:"월중",label:'<span class="who '+s.owner+'"></span>'+esc(srcLabel(s)),out:r.bySrc[s.id],raw:true}));
  return {rows:rows.concat(tail),r};
}

/* ---------- persistence ---------- */
const LS_KEY="gagyebu-v1";
const store={timers:{},chains:{},dirty:{},
  queue(key){this.dirty[key]=(this.dirty[key]||0)+1;clearTimeout(this.timers[key]);this.timers[key]=setTimeout(()=>this.flush(key),450);},
  flush(key){
    if(S.mode==="local"){this.dirty[key]=0;saveLocal();return;}
    if(!FB.db||S.mode!=="db"){this.dirty[key]=0;return;}
    let path,data;
    if(key==="config"){path=FB.base+"/ledger/config";data=S.config;}
    else{const ym=key.slice(2);path=FB.base+"/months/"+ym;data=S.months[ym];}
    const snapshot=data?clone(data):null;
    const run=async()=>{
      try{ if(snapshot)await FB.set(path,snapshot); else await FB.del(path); }
      catch(e){
        const c=(e&&e.code)||"";
        if(c==="permission-denied"){stopListening();S.mode="denied";render();}
        else if(c==="resource-exhausted")toast("Firebase 무료 사용량을 넘었어요. 내일 다시 시도해 주세요.");
        else toast("저장하지 못했어요. 인터넷 연결을 확인한 뒤 다시 바꿔 보세요.");
      }
    };
    this.chains[key]=(this.chains[key]||Promise.resolve()).then(run).finally(()=>{this.dirty[key]=Math.max(0,(this.dirty[key]||1)-1);});
  }
};
const saveConfig=()=>store.queue("config");
const saveMonth=ym=>store.queue("m:"+ym);
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({config:S.config,months:S.months}));}catch(e){}}
function loadLocal(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){}
  S.config=normConfig(d&&d.config);
  S.months={};if(d&&d.months)for(const k in d.months)S.months[k]=normMonth(d.months[k],k);
}

let deferred=false;
function isTyping(){const a=document.activeElement;return a&&a.matches&&a.matches("input[type=text],textarea,input:not([type])")&&document.getElementById("app").contains(a);}
function softRender(){if(isTyping()){deferred=true;return;}render();}
document.addEventListener("focusout",()=>{if(deferred){setTimeout(()=>{if(deferred&&!isTyping()){deferred=false;render();}},0);}});

const FB={db:null,auth:null,authM:null,fs:null,base:"households/"+HOUSEHOLD_ID,unsubs:[]};
function stopListening(){FB.unsubs.forEach(u=>{try{u();}catch(e){}});FB.unsubs=[];}
function onFbErr(e){
  const c=(e&&e.code)||"";
  stopListening();
  if(c==="permission-denied"){S.mode="denied";render();}
  else{S.mode="error";S.error="데이터를 불러오지 못했어요 ("+(c||"알 수 없는 오류")+"). 인터넷 연결을 확인하고 다시 시도해 주세요.";render();}
}
function listen(){
  const fs=FB.fs,db=FB.db;
  let gotC=false,gotM=false;
  const ready=()=>{if(gotC&&gotM){S.loaded=true;softRender();}};
  FB.unsubs.push(fs.onSnapshot(fs.doc(db,FB.base+"/ledger/config"),snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists()&&!store.dirty.config)S.config=normConfig(snap.data());
    gotC=true;ready();
  },onFbErr));
  FB.unsubs.push(fs.onSnapshot(fs.collection(db,FB.base+"/months"),qs=>{
    if(qs.metadata.hasPendingWrites)return;
    const next={};qs.docs.forEach(d=>{next[d.id]=normMonth(d.data(),d.id);});
    for(const k in store.dirty){if(store.dirty[k]&&k.startsWith("m:")){const ym=k.slice(2);if(S.months[ym])next[ym]=S.months[ym];else delete next[ym];}}
    S.months=next;gotM=true;ready();
  },onFbErr));
}
async function boot(){
  if(!FIREBASE_CONFIG.apiKey){S.mode="local";S.setupNeeded=true;loadLocal();render();return;}
  S.mode="auth";render();
  try{
    const base="https://www.gstatic.com/firebasejs/"+FIREBASE_SDK+"/";
    const [appM,authM,fs]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const app=appM.initializeApp(FIREBASE_CONFIG);
    let db;
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}
    catch(e){db=fs.getFirestore(app);}
    FB.db=db;FB.fs=fs;FB.authM=authM;FB.auth=authM.getAuth(app);
    FB.set=(path,data)=>fs.setDoc(fs.doc(db,path),data);
    FB.del=path=>fs.deleteDoc(fs.doc(db,path));
    authM.getRedirectResult(FB.auth).catch(()=>{});
    authM.onAuthStateChanged(FB.auth,user=>{
      stopListening();
      S.config=normConfig(null);S.months={};S.loaded=false;S.confirm=null;
      if(!user){S.user=null;S.mode="login";render();return;}
      S.user=user.email;S.mode="db";render();listen();
    });
  }catch(e){
    S.mode="error";S.error="Firebase를 불러오지 못했어요. index.html 위쪽의 FIREBASE_CONFIG 값과 인터넷 연결을 확인해 주세요.";render();
  }
}
async function login(){
  const {GoogleAuthProvider,signInWithPopup,signInWithRedirect}=FB.authM;
  const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
  try{await signInWithPopup(FB.auth,pr);}
  catch(e){
    const c=(e&&e.code)||"";
    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(FB.auth,pr);}catch(e2){toast("로그인하지 못했어요. Safari나 Chrome에서 열어 주세요.");}}
    else if(c==="auth/unauthorized-domain")toast("Firebase 인증 설정의 승인된 도메인에 이 주소를 추가해 주세요.");
    else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")toast("로그인하지 못했어요 ("+c+").");
  }
}

/* ---------- month creation ---------- */
function holidayMonth(ym){const {y,m}=ymParts(ym);const h=HOLI[y];if(!h)return null;if(h.seol===m)return "설";if(h.chuseok===m)return "추석";return null;}
function buildMonth(ym,fromPrev){
  const cfg=S.config,d=cfg.defaults,prev=S.months[addM(ym,-1)];
  const m=normMonth({},ym);
  if(fromPrev&&prev){
    m.incomes=prev.incomes.filter(i=>["salary","support"].includes(i.type)).map(i=>Object.assign({},i,{id:uid()}));
    m.transfers=clone(prev.transfers);
    m.fixed=prev.fixed.map(f=>Object.assign({},f,{paid:false}));
    m.savings=clone(prev.savings);
  }else{
    m.incomes=[
      {id:uid(),day:cfg.paydays.h,who:"h",type:"salary",amount:d.hSalary,memo:""},
      {id:uid(),day:cfg.paydays.w,who:"w",type:"salary",amount:d.wSalary,memo:""},
      {id:uid(),day:cfg.paydays.support,who:"w",type:"support",amount:d.support,memo:""}
    ];
    m.transfers={hAllow:d.hAllow,wAllow:d.wAllow,hLiving:d.hLiving,wLiving:d.wLiving};
    m.fixed=cfg.fixed.map(f=>({id:f.id,name:f.name,owner:f.owner,amount:f.amount,paid:false}));
  }
  ["trip","bonus"].forEach(t=>{if(!m.incomes.some(i=>i.who==="h"&&i.type===t))m.incomes.push({id:uid(),day:cfg.paydays.trip,who:"h",type:t,amount:0,memo:""});});
  m.incomes.sort((a,b)=>(Number(a.day)||32)-(Number(b.day)||32));
  const hol=holidayMonth(ym);
  if(hol&&!m.incomes.some(i=>i.type==="points"))m.incomes.push({id:uid(),day:"",who:"w",type:"points",amount:d.points,memo:hol});
  m.loans=cfg.loans.filter(l=>loanActive(l,ym)).map(l=>{
    const p=fromPrev&&prev?prev.loans.find(x=>x.loanId===l.id):null;
    return {loanId:l.id,amount:p?p.amount:l.monthly,lump:0};
  });
  return m;
}

    const lsTxt=(ls.getMonth()+1)+"월 "+ls.getDate()+"일 일요일";
    if(m&&m.closed)h.push('<span class="hint">'+lsTxt+' 작성일, 마감 완료</span>');
    else if(today>ls&&ymOf(today)>=S.ym)h.push('<span class="hint alert">작성일 '+lsTxt+'이 지났어요. 정리하고 마감해 주세요</span>');
    else h.push('<span class="hint">작성일 '+lsTxt+'</span>');
    if(m&&!m.closed){const ti=sum(m.incomes.filter(i=>i.who==="h"&&(i.type==="trip"||i.type==="bonus")));const due=ymCmp(S.ym,ymOf(today))<0||(S.ym===ymOf(today)&&today.getDate()>=S.config.paydays.trip);if(!ti&&due)h.push('<span class="hint">'+S.config.paydays.trip+'일 무렵 '+esc(nameOf("h"))+' 출장비·상여가 들어왔다면 수입에 넣어 주세요</span>');}
    const {m:mm}=ymParts(S.ym),hol=holidayMonth(S.ym);
    if(hol)h.push('<span class="hint">'+hol+' 명절 달: '+esc(nameOf("w"))+' 네이버포인트 '+man(S.config.defaults.points)+'</span>');
    if(mm<=2)h.push('<span class="hint">연초: '+esc(nameOf("w"))+' 인센티브 들어오는 시기</span>');
    if(mm===12)h.push('<span class="hint">연말: '+esc(nameOf("h"))+' 인센티브로 신용대출 상환</span>');
    hints='<div class="hints">'+h.join("")+'</div>';
  }
  return '<header class="top"><div class="wrap"><div class="top-in"><div class="brand">우리집 가계부<small>매달 마지막 주 일요일에 정리해요</small></div>'+nav+'</div><div class="tabs" role="tablist">'+tabs.map(t=>'<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-act="tab" data-id="'+t[0]+'" data-fk="tab:'+t[0]+'">'+t[1]+'</button>').join("")+'</div>'+hints+'</div></header>';
}

  const t=m.transfers;

  const fixed='<details class="sec" open><summary><h3>고정비</h3><span class="sum">'+won(r.fixed)+'원</span></summary><div class="sec-body"><div class="rows">'+fxRows+'</div><div class="adds">'+btn("addFx","+ 이번 달만 추가")+'</div><p class="note" style="margin:8px 0 0">관리비, 주담대처럼 금액이 조금씩 바뀌는 항목은 이 달 금액으로 고쳐 주세요. 체크는 빠져나간 것을 확인했다는 표시예요.</p></div></details>';

  const payOpts=payerOpts();
  const lnRows=m.loans.map(l=>{
    const L=S.config.loans.find(x=>x.id===l.loanId);if(!L)return "";

    let turn="";
    if(L.start&&L.months>0){const n=monthDiff(L.start,S.ym)+1;if(n>=1)turn=n+"/"+L.months+"회차";}
    const info=[turn,b!=null?"잔액 "+won(b)+"원":"",L.note||""].filter(Boolean).join(", ");
    return '<div class="ln-item"><div class="row ln2">'+txtInput(k+"name",L.name,"항목 이름")+sel(k+"payer",L.payer||"",payOpts,"어디서 나가나요")+amtInput("m.loans."+l.loanId+".amount",l.amount,"","이번 달 상환")+amtInput("m.loans."+l.loanId+".lump",l.lump,"","목돈 상환")+delBtn("delLn",l.loanId)+'</div>'+
      '<div class="row ln3">'+sel(k+"kind",L.kind,LOAN_KINDS.map(x=>({v:x,l:x})),"종류")+txtInput(k+"start",L.start,"시작 월")+numInput(k+"months",L.months||"","개월")+amtInput(k+"principal",L.principal,"","원금")+'<span class="note">'+esc(info)+'</span></div></div>';

  const closeBox='<details class="sec" open><summary><h3>메모와 마감</h3></summary><div class="sec-body"><textarea class="f" data-k="m.memo" data-t="text" data-fk="m.memo" placeholder="이 달에 있었던 일, 다음 달에 챙길 것"'+dis()+'>'+esc(m.memo)+'</textarea><div class="closebar" style="margin-top:10px">'+

    '</div></div></details>';

  const out='<div class="month"><div class="left">'+pb+pots+'</div><div class="right">'+income+transfers+fixed+loans+spends+savings+closeBox+'</div></div>';
  monthLocked=false;
  return out;
}
function stampHtml(m){
  const ls=lastSunday(m.ym);const d=m.closedAt?new Date(m.closedAt):ls;
  return '<div class="stamp'+(S.stampFresh===m.ym?" fresh":"")+'" aria-label="마감됨"><div><b>마감</b><i>'+(d.getMonth()+1)+'.'+d.getDate()+'</i></div></div>';
}

function monthsOfYear(y){const a=[];for(let i=1;i<=12;i++)a.push(y+"-"+String(i).padStart(2,"0"));return a;}
function viewYear(){
  const y=S.year,yms=monthsOfYear(y);
  const tot={inc:0,tr:0,fl:0,card:0,sv:0,iv:0,left:0};
  const body=yms.map(ym=>{
    const m=S.months[ym],mm=ymParts(ym).m;
    if(!m)return '<tr class="click" tabindex="0" data-act="goMonth" data-id="'+ym+'"><td>'+mm+'월</td><td colspan="7" class="dim">기록 없음</td><td></td></tr>';
    const r=calc(m);
    tot.inc+=r.cashIncome;tot.tr+=r.transfers;tot.fl+=r.fixed+r.loans;tot.card+=r.card;tot.sv+=r.saving;tot.iv+=r.invest;tot.left+=r.left;
    return '<tr class="click" tabindex="0" data-act="goMonth" data-id="'+ym+'"><td>'+mm+'월</td><td>'+won(r.cashIncome)+'</td><td>'+won(r.transfers)+'</td><td>'+won(r.fixed+r.loans)+'</td><td>'+won(r.card)+'</td><td>'+won(r.saving)+'</td><td>'+won(r.invest)+'</td><td class="'+(r.left<0?"neg":"")+'">'+won(r.left)+'</td><td>'+(m.closed?'<span class="mini-stamp">완</span>':"")+'</td></tr>';
  }).join("");
  const rate=tot.inc?Math.round((tot.sv+tot.iv)/tot.inc*1000)/10:0;
  const table='<div class="card"><h3>'+y+'년 한눈에 보기</h3><div class="kpis"><div class="kpi"><span>올해 현금 수입</span><b>'+man(tot.inc)+'</b></div><div class="kpi"><span>올해 저금·투자</span><b>'+man(tot.sv+tot.iv)+'</b></div><div class="kpi"><span>저축률</span><b>'+rate+'%</b></div></div><div class="tscroll"><table class="t"><thead><tr><th>월</th><th>수입</th><th>자동이체</th><th>고정·할부</th><th>카드·현금</th><th>저금</th><th>투자</th><th>남은 돈</th><th>마감</th></tr></thead><tbody>'+body+
    '<tr class="tot"><td>합계</td><td>'+won(tot.inc)+'</td><td>'+won(tot.tr)+'</td><td>'+won(tot.fl)+'</td><td>'+won(tot.card)+'</td><td>'+won(tot.sv)+'</td><td>'+won(tot.iv)+'</td><td class="'+(tot.left<0?"neg":"")+'">'+won(tot.left)+'</td><td></td></tr></tbody></table></div><p class="note" style="margin:8px 0 0">행을 누르면 그 달로 이동해요. 자동이체는 용돈과 생활비 이체 합계예요.</p></div>';

  // yearly events
  const incIn=(who,type,ms)=>{let s=0;ms.forEach(ym=>{const m=S.months[ym];if(m)s+=sum(m.incomes.filter(i=>i.who===who&&i.type===type));});return s;};
  const h=HOLI[y]||{};
  const ev=[];
  const evRow=(when,what,amt,planned)=>ev.push('<div class="ev"><span class="when">'+when+'</span><span>'+what+'</span><span class="st'+(amt?" got":"")+'">'+(amt?"받음 "+won(amt)+"원":planned)+'</span></div>');
  evRow("1~2월",esc(nameOf("w"))+" 인센티브",incIn("w","incentive",[y+"-01",y+"-02",y+"-03"]),"예정");
  if(h.seol)evRow(h.seol+"월 (설)",esc(nameOf("w"))+" 네이버포인트",incIn("w","points",[y+"-"+String(h.seol).padStart(2,"0")]),"예정 "+man(S.config.defaults.points));
  if(h.chuseok)evRow(h.chuseok+"월 (추석)",esc(nameOf("w"))+" 네이버포인트",incIn("w","points",[y+"-"+String(h.chuseok).padStart(2,"0")]),"예정 "+man(S.config.defaults.points));
  const irr=t=>{let s=0,c=0;yms.forEach(ym=>{const m=S.months[ym];if(m){const v=sum(m.incomes.filter(i=>i.who==="h"&&i.type===t));if(v){s+=v;c++;}}});return {s,c};};
  [["trip","출장비"],["bonus","상여금"]].forEach(([t,l])=>{const x=irr(t);ev.push('<div class="ev"><span class="when">'+S.config.paydays.trip+'일 무렵</span><span>'+esc(nameOf("h"))+' '+l+(x.c?' <span class="note">'+x.c+'개월 들어옴</span>':"")+'</span><span class="st'+(x.s?" got":"")+'">'+(x.s?"올해 "+won(x.s)+"원":"아직 없음")+'</span></div>');});
  const hInc=incIn("h","incentive",[y+"-11",y+"-12"]);
  evRow("12월 무렵",esc(nameOf("h"))+" 인센티브",hInc,"예정");
  const endYm=y+"-12";
  S.config.loans.filter(l=>l.kind==="대출").forEach(l=>{
    const b=loanBalance(l,endYm);

  });
  const events='<div class="card"><h3>불규칙하게 들어오는 돈</h3>'+ev.join("")+'</div>';

  return table+events+cats;
}

function viewSave(){
  const cfg=S.config,cur=S.ym;
  const dep=id=>{let s=0;for(const k in S.months){s+=Number(S.months[k].savings[id])||0;}return s;};
  let tS=0,tI=0,tV=0,hasV=false;
  const rows=cfg.accounts.map(a=>{
    const d=dep(a.id),total=(a.base||0)+d;
    let val="",gain="";
    if(a.kind==="투자"){tI+=total;const v=a.value||0;if(v){hasV=true;tV+=v;const g=v-total;gain='<span style="color:'+(g>=0?"var(--save)":"var(--stamp)")+'">'+(g>=0?"+":"")+won(g)+'</span>';}else tV+=total;
      val=amtInput("c.accounts."+a.id+".value",a.value);}
    else tS+=total;
    return '<tr><td><span class="who '+a.owner+'"></span>'+esc(nameOf(a.owner)+" "+a.name)+'</td><td>'+esc(a.kind)+'</td><td>'+won(a.base)+'</td><td>'+won(d)+'</td><td><b>'+won(total)+'</b></td><td style="width:9.5em">'+val+'</td><td>'+gain+'</td></tr>';
  }).join("");
  const table='<div class="card"><h3>계좌별 누적</h3><div class="kpis"><div class="kpi"><span>적금 누적</span><b>'+man(tS)+'</b></div><div class="kpi"><span>투자 넣은 돈</span><b>'+man(tI)+'</b></div>'+(hasV?'<div class="kpi"><span>투자 평가액</span><b>'+man(tV)+'</b></div>':"")+'<div class="kpi"><span>전체</span><b>'+man(tS+(hasV?tV:tI))+'</b></div></div><div class="tscroll"><table class="t"><thead><tr><th>계좌</th><th>종류</th><th>시작 잔액</th><th>가계부로 넣은 돈</th><th>합계</th><th>지금 평가액</th><th>수익</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="note" style="margin:8px 0 0">시작 잔액과 계좌 이름은 설정에서 바꿀 수 있어요. 투자 평가액은 마감할 때 앱에서 확인한 금액으로 고쳐 두면 수익이 계산돼요.</p></div>';

  // chart: last 12 months
  const yms=[];for(let i=11;i>=0;i--)yms.push(addM(cur,-i));
  const data=yms.map(ym=>{const m=S.months[ym];if(!m)return {ym,s:0,i:0,inc:0};const r=calc(m);return {ym,s:r.saving,i:r.invest,inc:r.cashIncome};});
  const max=Math.max(1,...data.map(d=>d.s+d.i));
  const W=720,H=240,pl=48,pb=28,pt=12,bw=(W-pl-10)/12;
  const yv=v=>pt+(H-pt-pb)*(1-v/max);
  let g="";
  [0,.5,1].forEach(f=>{const v=max*f;g+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+yv(v)+'" y2="'+yv(v)+'" stroke="var(--line-soft)"/><text x="'+(pl-6)+'" y="'+(yv(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+man(v)+'</text>';});
  data.forEach((d,i)=>{
    const x=pl+i*bw+bw*.18,w=bw*.64;
    const ys=yv(d.s),yi=yv(d.s+d.i);
    if(d.s)g+='<rect x="'+x+'" y="'+ys+'" width="'+w+'" height="'+(yv(0)-ys)+'" fill="var(--save)" rx="2"><title>'+ymLabel(d.ym)+' 저금 '+won(d.s)+'원</title></rect>';
    if(d.i)g+='<rect x="'+x+'" y="'+yi+'" width="'+w+'" height="'+(ys-yi)+'" fill="var(--h)" rx="2"><title>'+ymLabel(d.ym)+' 투자 '+won(d.i)+'원</title></rect>';
    g+='<text x="'+(x+w/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+ymParts(d.ym).m+'월</text>';
  });
  const chart='<div class="card chart"><h3>최근 12개월 저금·투자</h3><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="최근 12개월 월별 저금과 투자 금액">'+g+'</svg><div class="legend"><span><i style="background:var(--save)"></i>저금</span><span><i style="background:var(--h)"></i>투자</span></div></div>';

  // by person
  const per={h:0,w:0,j:0};cfg.accounts.forEach(a=>{per[a.owner]=(per[a.owner]||0)+(a.base||0)+dep(a.id);});
  const person='<div class="card"><h3>사람별 모은 돈</h3><div class="kpis"><div class="kpi"><span><span class="who h"></span>'+esc(nameOf("h"))+'</span><b>'+man(per.h)+'</b></div><div class="kpi"><span><span class="who w"></span>'+esc(nameOf("w"))+'</span><b>'+man(per.w)+'</b></div>'+(per.j?'<div class="kpi"><span><span class="who j"></span>공동</span><b>'+man(per.j)+'</b></div>':"")+'</div><p class="note" style="margin:0">투자는 넣은 돈 기준이에요.</p></div>';
  return table+chart+person;
}

/* ---------- editing ---------- */
function setPath(root,parts,val){
  let o=root;
  for(let i=0;i<parts.length-1;i++){
    const p=parts[i];
    if(Array.isArray(o)){o=o.find(x=>x.id===p||x.loanId===p);if(!o)return false;}
    else{if(o[p]==null)o[p]={};o=o[p];}
  }
  const last=parts[parts.length-1];
  if(Array.isArray(o))return false;
  o[last]=val;return true;
}
function applyField(el){
  if(S.readOnly)return;
  const k=el.getAttribute("data-k"),t=el.getAttribute("data-t");
  let v;
  if(t==="amt")v=parseAmt(el.value);
  else if(t==="num"){v=parseAmt(el.value);if(!el.value.trim())v="";}
  else if(t==="bool")v=el.checked;
  else v=el.value;
  const parts=k.split(".");const scope=parts.shift();
  if(scope==="m"){
    const m=S.months[S.ym];if(!m||m.closed)return;
    if(parts[0]==="loans"&&!m.loans.find(x=>x.loanId===parts[1]))return;
    if(setPath(m,parts,v))saveMonth(S.ym);
    if(parts[0]==="loans"&&parts[2]==="amount"){const L=S.config.loans.find(x=>x.id===parts[1]);if(L&&!L.monthly&&v){L.monthly=v;saveConfig();}}
  }else if(scope==="c"){
    if(parts[0]==="paydays")v=Math.min(31,Math.max(1,Number(v)||1));
    if(parts[0]==="loans"&&parts[2]==="months")v=Number(v)||0;
    if(setPath(S.config,parts,v))saveConfig();
  }
}
let renderTimer=null;
const scheduleRender=()=>{clearTimeout(renderTimer);renderTimer=setTimeout(render,0);};
app.addEventListener("change",e=>{const el=e.target.closest("[data-k]");if(!el)return;applyField(el);scheduleRender();});
app.addEventListener("focusin",e=>{const el=e.target;if(el.matches&&el.matches('input[data-t="amt"]'))setTimeout(()=>{try{el.select();}catch(_){}} ,0);});
app.addEventListener("keydown",e=>{if(e.key!=="Enter"||!e.target.matches)return;if(e.target.matches("input.f"))e.target.blur();else if(e.target.matches("tr[data-act]"))e.target.click();});

function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

const A={
  tab:id=>{S.tab=id;S.confirm=null;window.scrollTo(0,0);},
  prev:()=>{S.ym=addM(S.ym,-1);S.confirm=null;},
  next:()=>{S.ym=addM(S.ym,1);S.confirm=null;},
  today:()=>{S.ym=ymOf(new Date());},
  yprev:()=>{S.year--;},ynext:()=>{S.year++;},
  goMonth:id=>{S.ym=id;S.tab="month";window.scrollTo(0,0);},
  start:()=>{S.months[S.ym]=buildMonth(S.ym,false);saveMonth(S.ym);},
  startPrev:()=>{S.months[S.ym]=buildMonth(S.ym,true);saveMonth(S.ym);},
  addInc:type=>{
    const m=cur();if(!m)return;const P=S.config.paydays;
    const presets={trip:{who:"h",day:P.trip},bonus:{who:"h",day:P.trip},incentive:{who:ymParts(S.ym).m<=6?"w":"h",day:""},points:{who:"w",day:"",amount:S.config.defaults.points},etc:{who:"h",day:""},cash:{who:"h",day:""}};
    const p=presets[type]||{who:"h",day:""};
    m.incomes.push({id:uid(),day:p.day,who:p.who,type,amount:p.amount||0,memo:""});saveMonth(S.ym);
  },
  delInc:id=>{const m=cur();m.incomes=m.incomes.filter(x=>x.id!==id);saveMonth(S.ym);},
  addFx:()=>{const m=cur();m.fixed.push({id:uid(),name:"",owner:"j",amount:0,paid:false});saveMonth(S.ym);},
  delFx:id=>{const m=cur();m.fixed=m.fixed.filter(x=>x.id!==id);saveMonth(S.ym);},
  addLn:id=>{const m=cur();const L=S.config.loans.find(x=>x.id===id);if(L){m.loans.push({loanId:id,amount:L.monthly,lump:0});saveMonth(S.ym);}},
  addSp:()=>{const m=cur();const last=m.spends[m.spends.length-1];m.spends.push({id:uid(),src:last?last.src:"joint",cat:last?last.cat:"식료품",amount:0,memo:""});saveMonth(S.ym);},
  addSpQuick:k=>{const m=cur();const p={wed:{src:"h_credit",cat:"결혼준비"},trip:{src:"h_corp",cat:"출장"},grocery:{src:"support",cat:"식료품"},cash:{src:"cash",cat:"기타"}}[k];m.spends.push({id:uid(),src:p.src,cat:p.cat,amount:0,memo:""});saveMonth(S.ym);},
  delSp:id=>{const m=cur();m.spends=m.spends.filter(x=>x.id!==id);saveMonth(S.ym);},
  fillLeft:id=>{const m=cur();const r=calc(m);if(r.left<=0){toast("넣을 수 있는 남은 돈이 없어요.");return;}m.savings[id]=(Number(m.savings[id])||0)+r.left;saveMonth(S.ym);},
  close:()=>{const m=cur();m.closed=true;m.closedAt=new Date().toISOString();S.stampFresh=S.ym;saveMonth(S.ym);},
  reopen:()=>{const m=cur();m.closed=false;delete m.closedAt;saveMonth(S.ym);},
  delMonthAsk:()=>{S.confirm="delMonth";},
  delMonth:()=>{delete S.months[S.ym];S.confirm=null;saveMonth(S.ym);toast(ymLabel(S.ym)+" 기록을 지웠어요.");},
  addFxT:()=>{S.config.fixed.push({id:uid(),name:"",owner:"j",amount:0});saveConfig();},
  delFxT:id=>{S.config.fixed=S.config.fixed.filter(x=>x.id!==id);saveConfig();},
  addLnT:()=>{S.config.loans.push({id:uid(),name:"",kind:"할부",monthly:0,start:S.ym,months:0,principal:0,note:"",payer:""});saveConfig();},
  newLn:()=>{const m=cur();if(!m)return;const id=uid();S.config.loans.push({id,name:"",kind:"할부",monthly:0,start:S.ym,months:0,principal:0,note:"",payer:"",addedIn:S.ym});m.loans.push({loanId:id,amount:0,lump:0});saveConfig();saveMonth(S.ym);},
  delLn:id=>{const m=cur();m.loans=m.loans.filter(x=>x.loanId!==id);saveMonth(S.ym);const L=S.config.loans.find(x=>x.id===id);const used=Object.keys(S.months).some(k=>k!==S.ym&&(S.months[k].loans||[]).some(x=>x.loanId===id));if(L&&L.addedIn===S.ym&&!used){S.config.loans=S.config.loans.filter(x=>x.id!==id);saveConfig();}},
  delLnT:id=>{S.config.loans=S.config.loans.filter(x=>x.id!==id);saveConfig();},
  addAc:()=>{S.config.accounts.push({id:uid(),owner:"h",kind:"적금",name:"",base:0,value:0});saveConfig();},
  delAc:id=>{S.config.accounts=S.config.accounts.filter(x=>x.id!==id);saveConfig();},
  export:()=>{doExport();return "skip";},
  login:()=>{login();return "skip";},
  logout:()=>{if(FB.auth)FB.authM.signOut(FB.auth);return "skip";},
  reload:()=>{location.reload();return "skip";},
  importAsk:()=>{S.confirm="import";},
  importGo:()=>{S.confirm=null;document.getElementById("importFile").click();}
};
const cur=()=>S.months[S.ym];
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(!A[act])return;
  if(!["delMonth","delMonthAsk","importAsk","importGo"].includes(act))S.confirm=null;
  const res=A[act](id);
  if(res!=="skip")render();
});

function doExport(){
  const data=JSON.stringify({app:"gagyebu",v:1,exportedAt:new Date().toISOString(),config:S.config,months:S.months},null,2);
  const name="가계부-백업-"+ymOf(new Date())+".json";
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast("백업 파일을 내려받았어요. 저장소에는 올리지 마세요.");}
  catch(e){toast("파일을 내보내지 못했어요.");}
}
document.getElementById("importFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!d.config||!d.months)throw new Error("bad");
    const old=Object.keys(S.months);
    S.config=normConfig(d.config);S.months={};
    for(const k in d.months)if(/^\d{4}-\d{2}$/.test(k))S.months[k]=normMonth(d.months[k],k);
    saveConfig();
    new Set(old.concat(Object.keys(S.months))).forEach(k=>saveMonth(k));
    toast("백업 파일을 가져왔어요.");render();
  }catch(err){toast("가계부 백업 파일이 아니에요. 내보내기로 만든 .json 파일을 골라 주세요.");}
});

boot();
})();
</script>
</body>
</html>
